<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>

    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap');

    body {
      font-family: 'Outfit', sans-serif;
      background-color: hsl(212, 45%, 89%);
      margin: 0;
      padding: 0;
    }

    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }

    .center_sec {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .description {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 1.5rem;
      text-align: center;
      line-height: 1.5;
    }

    .instructions {
      font-size: 1rem;
      color: hsl(220, 15%, 55%);
      text-align: center;
      margin-top: 0.75rem;
      max-width: 300px;
      line-height: 1.5;
    }

    .qr_code {
      width: 290px;
      height: auto;
      background-color: hsl(0, 0%, 100%);
      padding: 1.5rem;
      border-radius: 0.625rem;
      box-shadow: 0px 10px 15px -3px rgba(0, 0, 0, 0.1), 0px 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .qr_code_img {
      width: 100%;
      height: auto;
      border-radius: 0.625rem;
    }

  </style>
</head>

<body>
  <div class="center_sec">
    <section class="qr_code">
      <img class="qr_code_img" src="./images/image-qr-code.png" alt="QR Code"><br>

      <p class="description">Improve your front-end skills by building projects</p>

      <p class="instructions">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level
      </p>
    </section>
  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/ben-m-m">Ben Maina</a>.
  </footer>
</body>

</html>
